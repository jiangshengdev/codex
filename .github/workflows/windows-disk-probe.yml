name: Windows disk probe

on:
  workflow_dispatch:
    inputs:
      scan_directories:
        description: Scan tool directory sizes (adds several minutes)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    name: Disk probe — ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Record initial storage topology
        env:
          SCAN_DIRECTORIES: ${{ inputs.scan_directories }}
        run: ./.github/scripts/windows-disk-probe.ps1 -Phase Before -ScanDirectories:($env:SCAN_DIRECTORIES -eq 'true')
      - name: Configure the CI Dev Drive
        run: ./.github/scripts/setup-dev-drive.ps1
      - name: Record storage after Dev Drive setup
        if: ${{ always() }}
        run: ./.github/scripts/windows-disk-probe.ps1 -Phase After
      - name: Upload disk reports
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-disk-probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/windows-disk-probe/
          if-no-files-found: error
          retention-days: 7
