name: Rust CI native voice inputs
on:
  workflow_call:

jobs:
  native:
    name: Voice SDK - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            prefix: macos_aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            prefix: macos_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            prefix: linux_aarch64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            prefix: linux_x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            prefix: windows_aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            prefix: windows_x86_64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: ${{ startsWith(matrix.target, 'aarch64') && 'arm64' || 'x64' }}
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: ci-voice
      - uses: ./.github/actions/setup-msvc-env
        if: runner.os == 'Windows'
        with:
          target: ${{ matrix.target }}
      - name: Refresh Bazel PATH for the selected MSVC target
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/compute-bazel-windows-path.ps1
      # Use the release bootstrap without changing its upstream implementation.
      - name: Download pinned Windows build inputs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
          $directory = Join-Path $env:RUNNER_TEMP "voice-cygwin-snapshot"
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $manifest.archive.tag --repo openai/codex --pattern $manifest.archive.name --pattern $manifest.sourceArchive.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Cannot obtain the public Cygwin inputs and source" }
          $source = Join-Path $directory $manifest.sourceArchive.name
          if ((Get-Item $source).Length -ne $manifest.sourceArchive.bytes -or
              (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sourceArchive.sha256) {
            throw "Public Cygwin source archive mismatch"
          }
          & ./.github/scripts/setup-voice-windows.ps1 -Target "${{ matrix.target }}" -SnapshotArchive (Join-Path $directory $manifest.archive.name)
          if (-not $env:SystemRoot) { throw "Windows SystemRoot is required" }
          "VOICE_WINDOWS_SYSTEM_ROOT=$env:SystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $hostArch = $env:PROCESSOR_ARCHITEW6432
          if (-not $hostArch) { $hostArch = $env:PROCESSOR_ARCHITECTURE }
          if (-not $hostArch) { throw "Windows host architecture is required" }
          "VOICE_WINDOWS_HOST_ARCH=$hostArch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build release native inputs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bazel build -c opt --remote_download_all \
            //third_party/voice:native_link //third_party/voice:native_sdk \
            //third_party/voice:pkg_config
      - name: Build release native inputs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VOICE_ARCH: ${{ startsWith(matrix.target, 'aarch64') && 'aarch64' || 'x86_64' }}
          BAZEL_HOST_JVM_ARG: ${{ startsWith(matrix.target, 'aarch64') && '-Xint' || '' }}
          BUILDBUDDY_API_KEY: ""
        run: |
          python .github/scripts/watch_voice_bazel.py "$(cygpath -w "$BASH")" ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary --windows-msvc-host-platform -- \
            build -c opt --remote_download_all \
            --platforms=//:local_windows_msvc \
            --extra_toolchains=@local_config_cc//:cc-toolchain-x64_windows,@local_config_cc//:cc-toolchain-arm64_windows,//third_party/voice:windows_pkg_config_toolchain,//third_party/voice:windows_cmake_toolchain \
            --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --inject_repository="voice_windows_tools=$VOICE_WINDOWS_BAZEL_REPOSITORY" \
            --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools \
            --action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT" \
            --host_action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT" \
            --action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH" \
            --host_action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH" \
            --workspace_status_command=./scripts/workspace-status.cmd \
            --build_metadata=COMMIT_SHA="$GITHUB_SHA" -- \
            //third_party/voice:native_link //third_party/voice:native_sdk
      - name: Pack Cargo inputs
        shell: bash
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/voice-ci"
          mkdir -p "$output/tools"
          cp -RL "bazel-bin/third_party/voice/native_link_${PREFIX}" "$output/runtime"
          cp -RL "bazel-bin/third_party/voice/native_runtime_${PREFIX}_sdk" "$output/sdk"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp -RL "$(dirname "$(cygpath -u "$VOICE_PKG_CONFIG")")/." "$output/tools/"
          else
            # The public alias selects the host-specific foreign_cc output.
            pkg_config=$(bazel cquery -c opt --output=files //third_party/voice:pkg_config)
            cp "$pkg_config" "$output/tools/pkg-config"
            chmod +x "$output/tools/pkg-config"
          fi
          tar -C "$output" -czf "$RUNNER_TEMP/voice-ci.tar.gz" runtime sdk tools
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: voice-ci-${{ matrix.target }}
          path: ${{ runner.temp }}/voice-ci.tar.gz
          if-no-files-found: error
          retention-days: 1
