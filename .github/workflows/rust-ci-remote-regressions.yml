name: rust-ci-remote-regressions
on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  remote_regressions:
    name: Remote regressions - ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      USE_SCCACHE: "true"
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 10G
      RUST_BACKTRACE: 1
      RUST_MIN_STACK: "8388608"
      NEXTEST_STATUS_LEVEL: leak
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap

      # Some integration tests rely on DotSlash being installed.
      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ runner.os }}-x86_64-unknown-linux-gnu-dev-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ runner.os }}-x86_64-unknown-linux-gnu-dev-

      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ runner.os }}-x86_64-unknown-linux-gnu-dev-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-x86_64-unknown-linux-gnu-dev-${{ steps.lockhash.outputs.hash }}-
            sccache-${{ runner.os }}-x86_64-unknown-linux-gnu-dev-

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Enable unprivileged user namespaces
        shell: bash
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up remote test env
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TEST_REMOTE_ENV_CONTAINER_NAME=codex-remote-test-env
          source "${GITHUB_WORKSPACE}/scripts/test-remote-env.sh"
          echo "CODEX_TEST_REMOTE_ENV=${CODEX_TEST_REMOTE_ENV}" >> "$GITHUB_ENV"
          echo "CODEX_TEST_REMOTE_EXEC_SERVER_URL=${CODEX_TEST_REMOTE_EXEC_SERVER_URL}" >> "$GITHUB_ENV"

      - name: Run targeted regressions
        shell: bash
        run: |
          set +e

          failures=0

          tests=(
            "apply_patch move traversal rejects workspace escape|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::apply_patch_cli::apply_patch_cli_rejects_move_path_traversal_outside_workspace'"
            "apply_patch turn diff stays repo relative|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::apply_patch_cli::apply_patch_turn_diff_paths_stay_repo_relative_when_session_cwd_is_nested'"
            "remote env allows readable root under sandbox|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::remote_env::remote_test_env_sandboxed_read_allows_readable_root'"
            "remote env rejects symlink dotdot escape|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::remote_env::remote_test_env_sandboxed_read_rejects_symlink_parent_dotdot_escape'"
            "remote env remove deletes symlink not target|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::remote_env::remote_test_env_remove_removes_symlink_not_target'"
            "remote env copy preserves symlink source|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::remote_env::remote_test_env_copy_preserves_symlink_source'"
            "unified exec emits failed background end event for network denial|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::unified_exec::unified_exec_network_denial_emits_failed_background_end_event'"
            "view_image routes to selected remote environment|cargo nextest run -p codex-core --target x86_64-unknown-linux-gnu --cargo-profile ci-test --test-threads 1 'suite::view_image::view_image_routes_to_selected_remote_environment'"
          )

          for entry in "${tests[@]}"; do
            name="${entry%%|*}"
            command="${entry#*|}"
            echo "=== ${name} ==="
            bash -lc "${command}"
            status=$?
            if [[ ${status} -ne 0 ]]; then
              failures=$((failures + 1))
              echo "::error::${name} failed with exit code ${status}"
            fi
          done

          if [[ ${failures} -ne 0 ]]; then
            echo "::error::${failures} targeted regression command(s) failed"
            exit 1
          fi

      - name: Dump remote env logs on failure
        if: failure()
        shell: bash
        run: docker logs codex-remote-test-env || true

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ runner.os }}-x86_64-unknown-linux-gnu-dev-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ runner.os }}-x86_64-unknown-linux-gnu-dev-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        run: |
          {
            echo "### sccache stats — remote regressions";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down remote test env
        if: always()
        shell: bash
        run: docker rm -f codex-remote-test-env >/dev/null 2>&1 || true
