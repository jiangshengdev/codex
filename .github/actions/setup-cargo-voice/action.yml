name: Set up Cargo voice inputs
description: Consume the same-commit release SDK and prepared runtime for Cargo CI.
inputs:
  target:
    description: Native target triple for the SDK, runtime and pkg-config tool.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: voice-ci-${{ inputs.target }}
        path: ${{ runner.temp }}/voice-ci-download
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
        architecture: ${{ startsWith(inputs.target, 'aarch64') && 'arm64' || 'x64' }}
    - name: Activate SDK and runtime
      shell: bash
      env:
        VOICE_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        output="$RUNNER_TEMP/voice-ci"
        archive="$RUNNER_TEMP/voice-ci-download/voice-ci.tar.gz"
        if [[ "$RUNNER_OS" == Windows ]]; then
          output="$(cygpath -u "$output")"
          archive="$(cygpath -u "$archive")"
        fi
        mkdir -p "$output"
        tar -C "$output" -xzf "$archive"
        python "$GITHUB_WORKSPACE/.github/scripts/cargo_voice.py" configure \
          --root "$RUNNER_TEMP/voice-ci" --target "$VOICE_TARGET" --commit "$GITHUB_SHA"
